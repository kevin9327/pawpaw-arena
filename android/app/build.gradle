plugins {
    id 'com.android.application'
}

// 서명 정보는 gitignore된 keystore.properties 에서 읽는다 (없으면 릴리스 서명 생략)
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def rcApiKey = (project.findProperty('RC_API_KEY') ?: keystoreProps['rcApiKey'] ?: System.getenv('RC_API_KEY') ?: 'goog_REPLACE_ME').toString()

android {
    namespace 'com.petaflo.pawpawarena'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.petaflo.pawpawarena'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1.0'

        // RevenueCat 공개 API 키(goog_...). 우선순위: -PRC_API_KEY > keystore.properties[rcApiKey] > env RC_API_KEY > 플레이스홀더.
        // 플레이스홀더면 앱은 결제만 조용히 비활성(BillingManager.startConnection 참조).
        buildConfigField 'String', 'RC_API_KEY', '"' + rcApiKey + '"'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // Shipaton 요건: 인앱결제는 RevenueCat SDK 경유 (Play Billing은 SDK가 전이 의존성으로 포함)
    implementation 'com.revenuecat.purchases:purchases:10.15.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}

// 저장소 루트의 게임 자산(index.html, client/, shared/)을 앱 assets/game/ 로 복사.
// index.html은 상대경로(client/js/main.js, ../../shared/*)로 참조하므로
// assets/game 루트에 index.html + 그 아래 client/, shared/ 구조를 그대로 재현한다.
def gameAssetsDir = new File(projectDir, 'src/main/assets/game')
def repoRoot = rootProject.projectDir.parentFile

tasks.register('copyGameAssets', Copy) {
    description = '저장소 루트의 index.html/client/shared를 app/src/main/assets/game 로 복사'
    from(repoRoot) {
        include 'index.html'
        include 'client/**'
        include 'shared/**'
    }
    into gameAssetsDir
}

tasks.named('preBuild').configure {
    dependsOn 'copyGameAssets'
}
