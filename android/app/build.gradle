plugins {
    id 'com.android.application'
}

// 서명 정보는 gitignore된 keystore.properties 에서 읽는다 (없으면 릴리스 서명 생략)
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.petaflo.pawpawarena'
    compileSdk 35

    defaultConfig {
        applicationId 'com.petaflo.pawpawarena'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:7.1.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}

// 저장소 루트의 게임 자산(index.html, client/, shared/)을 앱 assets/game/ 로 복사.
// index.html은 상대경로(client/js/main.js, ../../shared/*)로 참조하므로
// assets/game 루트에 index.html + 그 아래 client/, shared/ 구조를 그대로 재현한다.
def gameAssetsDir = new File(projectDir, 'src/main/assets/game')
def repoRoot = rootProject.projectDir.parentFile

tasks.register('copyGameAssets', Copy) {
    description = '저장소 루트의 index.html/client/shared를 app/src/main/assets/game 로 복사'
    from(repoRoot) {
        include 'index.html'
        include 'client/**'
        include 'shared/**'
    }
    into gameAssetsDir
}

tasks.named('preBuild').configure {
    dependsOn 'copyGameAssets'
}
